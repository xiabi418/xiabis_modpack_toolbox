plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.6.1'
group = 'xiabis.modpack'

base {
    archivesName = 'xiabis_modpack_toolbox'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.266'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        xiabis_modpack_toolbox {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// maven.neoforged.net is unreachable from this network (SNI blocking on the CDN77
// endpoint). neoforged.forgecdn.net serves the same repository, so every repository
// the ModDevGradle plugin registers pointing at the original host gets redirected.
def redirectNeoForgedMaven = { repos ->
    repos.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).all { repo ->
        def target = repo.url.toString()
        if (target.contains('maven.neoforged.net')) {
            repo.url = target.replace('maven.neoforged.net', 'neoforged.forgecdn.net')
        }
    }
}
redirectNeoForgedMaven(repositories)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Curios API is a hard dependency. The jar is not committed (third-party LGPL-3.0
// binary), so it is downloaded into libs/ on demand; there it doubles as the
// compile-time API and as a mod that the dev runs load.
def curiosVersion = '9.5.1+1.21.1'
def curiosJar = layout.projectDirectory.file("libs/curios-neoforge-${curiosVersion}.jar")
def curiosUrl = 'https://cdn.modrinth.com/data/vvuO3ImH/versions/yohfFbgD/curios-neoforge-9.5.1%2B1.21.1.jar'

tasks.register('downloadCurios') {
    group = 'setup'
    description = 'Downloads the Curios API jar into libs/ when it is missing.'
    outputs.file(curiosJar)
    onlyIf { !curiosJar.asFile.exists() }
    doLast {
        curiosJar.asFile.parentFile.mkdirs()
        logger.lifecycle("Downloading Curios API ${curiosVersion} to libs/ ...")
        new URL(curiosUrl).withInputStream { input ->
            curiosJar.asFile.withOutputStream { output -> output << input }
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['compileJava', 'runClient', 'runServer', 'test']) {
        task.dependsOn('downloadCurios')
    }
}

dependencies {
    implementation files('libs/sophisticatedcore-1.21.1-1.5.39.2489.jar')
    implementation files('libs/sophisticatedbackpacks-1.21.1-3.26.22.2257.jar')
    implementation files('libs/sophisticatedstorage-1.21.1-1.6.20.2239.jar')


    implementation files(curiosJar)

    // Dev-only test mods (git-ignored), used to exercise the optional integrations:
    // Iron's Spellbooks + its dependencies, and later Apotheosis/AE2/GTM on demand.
    implementation files('libs/geckolib-neoforge-1.21.1-4.9.3.jar')
    implementation files('libs/player-animation-lib-forge-2.0.4+1.21.1.jar')
    implementation files('libs/irons_lib-1.21.1-2.3.0.jar')
    implementation files('libs/irons_spellbooks-1.21.1-3.16.3.jar')
    // AE2 is kept around because the generator has an AE output adapter.
    implementation files('libs/guideme-21.1.22.jar')
    implementation files('libs/ae2-19.2.20.jar')
    // Dev-only JEI so the ghost handler compiles; JEI stays optional at runtime.
    // JEI is optional at runtime: compile against the published artifact, and only put a local jar
    // on the dev runtime classpath when it is present (the ghost handler needs it to be testable).
    compileOnly 'mezz.jei:jei-1.21.1-neoforge:19.71.0.475'
    def jeiDevJar = layout.projectDirectory.file('libs/jei-1.21.1-neoforge-19.71.0.475.jar')
    if (jeiDevJar.asFile.exists()) {
        runtimeOnly files(jeiDevJar)
    }
    implementation files('libs/mezz_config-1.21.1-neoforge-0.7.1-standalone.jar')
    // Apotheosis stack, used to verify the 60 armor / 60 toughness caps.
    implementation files('libs/Placebo-1.21.1-9.9.4.jar')
    implementation files('libs/ApothicAttributes-1.21.1-2.11.0.jar')
    implementation files('libs/Apotheosis-1.21.1-8.9.0.jar')
}

processResources {
    def props = [version: project.version, mod_id: 'xiabis_modpack_toolbox']
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand props
    }
}
