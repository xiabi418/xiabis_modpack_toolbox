import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '2.6.4'
group = 'xiabis.modpack'

base {
    archivesName = 'xiabis_modpack_toolbox'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.266'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        xiabis_modpack_toolbox {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// maven.neoforged.net is unreachable from this network (SNI blocking on the CDN77
// endpoint). neoforged.forgecdn.net serves the same repository, so every repository
// the ModDevGradle plugin registers pointing at the original host gets redirected.
def redirectNeoForgedMaven = { repos ->
    repos.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).all { repo ->
        def target = repo.url.toString()
        if (target.contains('maven.neoforged.net')) {
            repo.url = target.replace('maven.neoforged.net', 'neoforged.forgecdn.net')
        }
    }
}
redirectNeoForgedMaven(repositories)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Curios API is a hard dependency. The jar is not committed (third-party LGPL-3.0
// binary), so it is downloaded into libs/ on demand; there it doubles as the
// compile-time API and as a mod that the dev runs load.
def curiosVersion = '9.5.1+1.21.1'
def curiosJar = layout.projectDirectory.file("libs/curios-neoforge-${curiosVersion}.jar")
def curiosUrl = 'https://cdn.modrinth.com/data/vvuO3ImH/versions/yohfFbgD/curios-neoforge-9.5.1%2B1.21.1.jar'

tasks.register('downloadCurios') {
    group = 'setup'
    description = 'Downloads the Curios API jar into libs/ when it is missing.'
    outputs.file(curiosJar)
    onlyIf { !curiosJar.asFile.exists() }
    doLast {
        curiosJar.asFile.parentFile.mkdirs()
        logger.lifecycle("Downloading Curios API ${curiosVersion} to libs/ ...")
        new URL(curiosUrl).withInputStream { input ->
            curiosJar.asFile.withOutputStream { output -> output << input }
        }
    }
}

def ae2Jar = layout.projectDirectory.file('libs/ae2-19.2.20.jar')

tasks.register('downloadAe2Api') {
    group = 'setup'
    description = 'Downloads the AE2 API jar for optional condenser compilation.'
    outputs.file(ae2Jar)
    onlyIf { !ae2Jar.asFile.exists() }
    doLast {
        ae2Jar.asFile.parentFile.mkdirs()
        def url = 'https://cdn.modrinth.com/data/XxWD5pD3/versions/7Ac6mXbf/appliedenergistics2-19.2.20.jar'
        def partial = new File(ae2Jar.asFile.parentFile, ae2Jar.asFile.name + '.part')
        def connection = new URI(url).toURL().openConnection()
        connection.connectTimeout = 15000
        connection.readTimeout = 30000
        connection.inputStream.withCloseable { input ->
            partial.withOutputStream { output -> output << input }
        }
        Files.move(partial.toPath(), ae2Jar.asFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.configureEach { task ->
    if (task.name in ['compileJava', 'runClient', 'runServer', 'test']) {
        task.dependsOn('downloadCurios', 'downloadAe2Api')
    }
}

dependencies {
    // Optional integration jars stay available to local dev runs when present, but are not required
    // for a clean clone. Reflection/registry-name adapters keep them out of the compile classpath.
    def optionalDevMod = { String fileName ->
        def file = layout.projectDirectory.file("libs/${fileName}")
        if (file.asFile.exists()) {
            runtimeOnly files(file)
        }
    }
    optionalDevMod('sophisticatedcore-1.21.1-1.5.39.2489.jar')
    optionalDevMod('sophisticatedbackpacks-1.21.1-3.26.22.2257.jar')
    optionalDevMod('sophisticatedstorage-1.21.1-1.6.20.2239.jar')
    optionalDevMod('cucumber-1.21.1-8.0.16.jar')
    optionalDevMod('mysticalagriculture-1.21.1-8.0.29.jar')
    optionalDevMod('geckolib-neoforge-1.21.1-4.9.3.jar')
    optionalDevMod('player-animation-lib-forge-2.0.4+1.21.1.jar')
    optionalDevMod('irons_lib-1.21.1-2.3.0.jar')
    optionalDevMod('irons_spellbooks-1.21.1-3.16.3.jar')
    if (!providers.gradleProperty('withoutAe2').isPresent()) {
        optionalDevMod('guideme-21.1.22.jar')
        optionalDevMod('ae2-19.2.20.jar')
    }
    compileOnly files(ae2Jar)
    optionalDevMod('mezz_config-1.21.1-neoforge-0.7.1-standalone.jar')
    optionalDevMod('Placebo-1.21.1-9.9.4.jar')
    optionalDevMod('ApothicAttributes-1.21.1-2.11.0.jar')
    optionalDevMod('Apotheosis-1.21.1-8.9.0.jar')

    implementation 'maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc1.21.1'

    implementation files(curiosJar)

    compileOnly 'mezz.jei:jei-1.21.1-neoforge:19.71.0.475'
    def jeiDevJar = layout.projectDirectory.file('libs/jei-1.21.1-neoforge-19.71.0.475.jar')
    if (jeiDevJar.asFile.exists()) {
        runtimeOnly files(jeiDevJar)
    }
}

processResources {
    def props = [version: project.version, mod_id: 'xiabis_modpack_toolbox']
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand props
    }
}
